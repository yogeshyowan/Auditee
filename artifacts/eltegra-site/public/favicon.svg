<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" fill="none" role="img" aria-label="Auditee">
  <defs>
    <linearGradient id="fav-grad" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="55%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="fav-shine" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="180" height="180" rx="36" fill="url(#fav-grad)"/>
  <rect width="180" height="180" rx="36" fill="url(#fav-shine)"/>
  <!-- Stylized A -->
  <path d="M44 138 L88 44 L132 138" stroke="#ffffff" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M60 110 L116 110" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
  <!-- Knowledge-graph node at apex -->
  <circle cx="88" cy="42" r="9" fill="#FDE68A"/>
  <!-- Audit check tick -->
  <path d="M120 142 L138 158 L168 124" stroke="#34D399" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
