kind = "video"
previewPath = "/auditee-tutorial/"
title = "Auditee Video Tutorial"
version = "1.0.0"
id = "artifacts/auditee-tutorial"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/auditee-tutorial/" ]
localPort = 20793

[services.development]
run = "pnpm --filter @workspace/auditee-tutorial run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/auditee-tutorial", "run", "build" ]
publicDir = "artifacts/auditee-tutorial/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20793"
BASE_PATH = "/auditee-tutorial/"
