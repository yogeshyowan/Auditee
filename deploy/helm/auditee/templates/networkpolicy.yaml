{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "auditee.fullname" . }}
  labels:
    {{- include "auditee.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "auditee.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressFromNamespace | quote }}
  egress:
    # Allow DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow intra-namespace traffic between API and web
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "auditee.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
    # Allow HTTPS egress (database, KMS, OIDC, SIEM, integrations)
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
{{- end }}
