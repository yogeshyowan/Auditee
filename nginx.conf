map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ~.+     $http_x_forwarded_proto;
}

map $http_x_forwarded_host $forwarded_host {
    default $host;
    ~.+     $http_x_forwarded_host;
}

upstream auditee_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression — fixes "Not compressed" Ahrefs issue
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        text/xml
        text/x-component
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        application/xhtml+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject
        image/svg+xml
        image/x-icon
        font/truetype
        font/opentype
        font/woff
        font/woff2;

    # Force HTTPS when behind a proxy that sets X-Forwarded-Proto
    # Only fires when the upstream proxy explicitly sends the header as "http"
    # so local dev (no proxy header) is unaffected.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$forwarded_host$request_uri;
    }

    # www → non-www canonical redirect (fixes "www.auditee.site not in sitemap")
    if ($forwarded_host = "www.auditee.site") {
        return 301 https://auditee.site$request_uri;
    }

    location = /healthz-web {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ─── Alias → canonical 301 redirects ────────────────────────────────────
    # These eliminate "Duplicate pages without canonical" and "3XX in sitemap"
    # Ahrefs issues by redirecting alias routes at the server level.

    # Features / platform aliases
    location = /ai-requirements-generation   { return 301 /ai-requirements-management; }

    # Compare aliases
    location = /compare/ibm-doors            { return 301 /compare/doors; }
    location = /compare/jama-connect         { return 301 /compare/jama; }
    location = /comparisons                  { return 301 /compare; }
    location = /alternatives                 { return 301 /compare; }

    # Integration aliases
    location = /jira-integration             { return 301 /integrations/jira; }
    location = /azure-devops-integration     { return 301 /integrations/azure-devops; }
    location = /integrations/ado             { return 301 /integrations/azure-devops; }
    location = /github-integration           { return 301 /integrations/github; }
    location = /slack-integration            { return 301 /integrations/slack; }
    location = /gitlab-integration           { return 301 /integrations/gitlab; }
    location = /confluence-integration       { return 301 /integrations/confluence; }

    # Standards / compliance aliases
    location = /iso26262                     { return 301 /iso-26262; }
    location = /functional-safety            { return 301 /iso-26262; }
    location = /iso21434                     { return 301 /iso-21434; }
    location = /automotive-cybersecurity     { return 301 /iso-21434; }
    location = /un-r155                      { return 301 /iso-21434; }
    location = /dpdp                         { return 301 /dpdp-act; }
    location = /india-data-protection        { return 301 /dpdp-act; }
    location = /eu-gdpr                      { return 301 /gdpr; }
    location = /uk-gdpr                      { return 301 /gdpr; }
    location = /iso27001                     { return 301 /iso-27001; }
    location = /isms                         { return 301 /iso-27001; }
    location = /hipaa-compliance             { return 301 /hipaa; }
    location = /dora-regulation              { return 301 /dora; }
    location = /digital-operational-resilience-act { return 301 /dora; }
    location = /ai-act                       { return 301 /eu-ai-act; }
    location = /eu-2024-1689                 { return 301 /eu-ai-act; }
    location = /aspice-4-0                   { return 301 /aspice; }
    location = /aspice-compliance            { return 301 /aspice; }
    location = /automotive-spice             { return 301 /aspice; }
    location = /iec62304                     { return 301 /iec-62304; }
    location = /iec-62304-compliance         { return 301 /iec-62304; }
    location = /qmsr                         { return 301 /fda-qmsr; }
    location = /21-cfr-820                   { return 301 /fda-qmsr; }

    # Legal / policy aliases
    location = /terms-of-services            { return 301 /terms-of-service; }
    location = /cookies                      { return 301 /cookie-policy; }
    location = /service-level-agreement      { return 301 /sla; }
    location = /data-processing-addendum     { return 301 /dpa; }
    location = /master-services-agreement    { return 301 /msa; }
    location = /business-associate-agreement { return 301 /baa; }
    location = /aup                          { return 301 /aup; }
    location = /acceptable-use              { return 301 /aup; }
    location = /acceptable-use-policy       { return 301 /aup; }
    location = /subprocessors               { return 301 /sub-processors; }
    location = /whitepaper                  { return 301 /security-whitepaper; }
    location = /penetration-test            { return 301 /pentest; }
    location = /caiq                        { return 301 /security-questionnaire; }
    location = /sig                         { return 301 /security-questionnaire; }
    location = /soc2                        { return 301 /soc-2; }
    location = /soc2-report                 { return 301 /soc-2; }
    location = /soc-2-type-ii              { return 301 /soc-2; }
    location = /refunds                     { return 301 /refund-policy; }
    location = /cancellation                { return 301 /cancellation-policy; }
    location = /shipping                    { return 301 /shipping-policy; }
    location = /delivery-policy             { return 301 /shipping-policy; }

    # Navigation / resource aliases
    location = /whats-new                   { return 301 /changelog; }
    location = /solutions                   { return 301 /use-cases; }
    location = /resources                   { return 301 /whitepapers; }
    location = /docs                        { return 301 /developers; }
    location = /partner-program             { return 301 /partners; }
    location = /uptime                      { return 301 /status; }
    location = /jobs                        { return 301 /careers; }
    location = /press                       { return 301 /newsroom; }
    location = /brand-kit                   { return 301 /brand; }
    location = /press-kit                   { return 301 /brand; }
    location = /events                      { return 301 /webinars; }
    location = /help-center                 { return 301 /help; }
    location = /support                     { return 301 /help; }
    location = /migrate                     { return 301 /migrations; }
    location = /affiliate-program           { return 301 /affiliates; }
    location = /referral                    { return 301 /affiliates; }
    location = /tools                       { return 301 /free-tools; }
    location = /sectors                     { return 301 /industries; }
    location = /startups                    { return 301 /for-startups; }
    location = /enterprise                  { return 301 /for-enterprise; }
    location = /template-library            { return 301 /templates; }
    location = /logos                       { return 301 /customers; }
    location = /standards-library           { return 301 /standards; }
    location = /roles                       { return 301 /teams; }
    location = /vulnerability-disclosure    { return 301 /vdp; }
    location = /security/disclosure         { return 301 /vdp; }
    location = /site-map                    { return 301 /sitemap; }
    location = /a11y                        { return 301 /accessibility; }
    location = /slack                       { return 301 /community; }
    location = /trust-center                { return 301 /trust; }
    # ─────────────────────────────────────────────────────────────────────────

    location /api/ {
        proxy_pass http://auditee_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $forwarded_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $forwarded_host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Direct HTTPS redirect — eliminates the HTTPS→HTTP→HTTPS redirect chain
    # that occurs when nginx internally resolves the trailing-slash directory redirect
    # over plain HTTP before the upstream proxy re-applies HTTPS.
    location = /auditee-tutorial {
        return 301 https://auditee.site/auditee-tutorial/;
    }

    location /auditee-tutorial/ {
        try_files $uri $uri/ /auditee-tutorial/index.html;
    }

    location /auditee-deck/ {
        try_files $uri $uri/ /auditee-deck/index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|map|mp3|wav|ogg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
