map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    ~.+     $http_x_forwarded_proto;
}

map $http_x_forwarded_host $forwarded_host {
    default $host;
    ~.+     $http_x_forwarded_host;
}

upstream auditee_api {
    server api:8080;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 50m;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location = /healthz-web {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://auditee_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $forwarded_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $forwarded_host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /auditee-tutorial/ {
        try_files $uri $uri/ /auditee-tutorial/index.html;
    }

    location /auditee-deck/ {
        try_files $uri $uri/ /auditee-deck/index.html;
    }

    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|map|mp3|wav|ogg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
