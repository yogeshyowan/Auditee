openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Auditee platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: projects
  - name: requirements
  - name: traceability
  - name: compliance
  - name: dashboard
  - name: activity
  - name: pdlc
  - name: legacy
  - name: billing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Project" }
  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }

  /requirements:
    get:
      operationId: listRequirements
      tags: [requirements]
      parameters:
        - { name: projectId, in: query, required: false, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { $ref: "#/components/schemas/RequirementType" } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/RequirementStatus" } }
        - { name: search, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Requirement" }
    post:
      operationId: createRequirement
      tags: [requirements]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRequirementBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Requirement" }
  /requirements/{requirementId}:
    get:
      operationId: getRequirement
      tags: [requirements]
      parameters:
        - { name: requirementId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RequirementDetail" }
    patch:
      operationId: updateRequirement
      tags: [requirements]
      parameters:
        - { name: requirementId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateRequirementBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Requirement" }
    delete:
      operationId: deleteRequirement
      tags: [requirements]
      parameters:
        - { name: requirementId, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Deleted }

  /traceability/graph:
    get:
      operationId: getTraceabilityGraph
      tags: [traceability]
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string } }
        - { name: frameworkId, in: query, required: false, schema: { type: string }, description: "When provided, the graph is restricted to the requirements linked to this framework, the code linked to those requirements, and the framework itself." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TraceabilityGraph" }

  /code-artifacts:
    get:
      operationId: listCodeArtifacts
      tags: [traceability]
      parameters:
        - { name: projectId, in: query, required: false, schema: { type: string } }
        - { name: language, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CodeArtifact" }

  /compliance/frameworks:
    get:
      operationId: listComplianceFrameworks
      tags: [compliance]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ComplianceFramework" }
  /compliance/frameworks/{frameworkId}:
    get:
      operationId: getComplianceFramework
      tags: [compliance]
      parameters:
        - { name: frameworkId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComplianceFrameworkDetail" }

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }

  /activity/recent:
    get:
      operationId: getRecentActivity
      tags: [activity]
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ActivityEvent" }

  /pdlc/stages:
    get:
      operationId: getPdlcStages
      tags: [pdlc]
      parameters:
        - { name: projectId, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PdlcStage" }

  /pdlc/stages/{id}:
    patch:
      operationId: updatePdlcStage
      tags: [pdlc]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchPdlcStageBody" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PdlcStage" }

  /legacy/systems:
    get:
      operationId: listLegacySystems
      tags: [legacy]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LegacySystem" }

  /demo-requests:
    post:
      operationId: createDemoRequest
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateDemoRequestBody" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DemoRequest" }

  /leads/capture:
    post:
      operationId: captureLead
      tags: [projects]
      summary: Capture a signed-in contact for downstream Google Form sync
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CaptureLeadBody" }
      responses:
        "201":
          description: New row captured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureLeadResult" }
        "200":
          description: Existing row \u2014 deduped, no new write
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CaptureLeadResult" }

  /billing/me:
    get:
      operationId: getBillingMe
      tags: [billing]
      summary: Current subscription state for the workspace
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingMe" }

  /billing/subscribe:
    post:
      operationId: createBillingSubscribe
      tags: [billing]
      summary: Create a Razorpay subscription (monthly) or order (annual)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingSubscribeBody" }
      responses:
        "200":
          description: Razorpay handles needed by Checkout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingSubscribeResult" }

  /billing/verify:
    post:
      operationId: createBillingVerify
      tags: [billing]
      summary: Verify Razorpay Checkout signature and activate the plan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BillingVerifyBody" }
      responses:
        "200":
          description: Plan activated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingVerifyResult" }

  /billing/cancel:
    post:
      operationId: createBillingCancel
      tags: [billing]
      summary: Cancel the active monthly subscription at period end
      responses:
        "200":
          description: Cancellation scheduled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingCancelResult" }

components:
  schemas:
    HealthStatus:
      type: object
      properties: { status: { type: string } }
      required: [status]

    RequirementType:
      type: string
      enum: [BRD, PRD, FRD, NFR]
    RequirementStatus:
      type: string
      enum: [draft, in_review, approved, implemented, verified]
    RequirementPriority:
      type: string
      enum: [low, medium, high, critical]

    Project:
      type: object
      required: [id, name, slug, description, requirementCount, complianceScore, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        description: { type: string }
        owner: { type: string }
        requirementCount: { type: integer }
        complianceScore: { type: integer }
        createdAt: { type: string, format: date-time }

    Requirement:
      type: object
      required: [id, projectId, code, title, type, status, priority, owner, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        code: { type: string }
        title: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/RequirementType" }
        status: { $ref: "#/components/schemas/RequirementStatus" }
        priority: { $ref: "#/components/schemas/RequirementPriority" }
        owner: { type: string }
        tags:
          type: array
          items: { type: string }
        linkedCodeCount: { type: integer }
        linkedFrameworks:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RequirementDetail:
      allOf:
        - $ref: "#/components/schemas/Requirement"
        - type: object
          properties:
            linkedCode:
              type: array
              items: { $ref: "#/components/schemas/CodeArtifact" }
            children:
              type: array
              items: { $ref: "#/components/schemas/Requirement" }

    CreateRequirementBody:
      type: object
      required: [projectId, title, type]
      properties:
        projectId: { type: string }
        title: { type: string }
        description: { type: string }
        type: { $ref: "#/components/schemas/RequirementType" }
        status: { $ref: "#/components/schemas/RequirementStatus" }
        priority: { $ref: "#/components/schemas/RequirementPriority" }
        owner: { type: string }
        tags:
          type: array
          items: { type: string }

    UpdateRequirementBody:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        status: { $ref: "#/components/schemas/RequirementStatus" }
        priority: { $ref: "#/components/schemas/RequirementPriority" }
        owner: { type: string }
        tags:
          type: array
          items: { type: string }
        linkedFrameworks:
          type: array
          items: { type: string }

    CodeArtifact:
      type: object
      required: [id, projectId, filePath, language, symbol, kind]
      properties:
        id: { type: string }
        projectId: { type: string }
        filePath: { type: string }
        language: { type: string }
        symbol: { type: string }
        kind: { type: string, description: "function | class | module | service" }
        repoUrl: { type: string }
        linkedRequirementCount: { type: integer }

    TraceabilityNode:
      type: object
      required: [id, label, kind]
      properties:
        id: { type: string }
        label: { type: string }
        kind: { type: string, description: "requirement | code | framework" }
        meta: { type: string }
    TraceabilityEdge:
      type: object
      required: [from, to, kind]
      properties:
        from: { type: string }
        to: { type: string }
        kind: { type: string, description: "implements | covers | depends" }
    TraceabilityGraph:
      type: object
      required: [nodes, edges]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/TraceabilityNode" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/TraceabilityEdge" }

    ComplianceFramework:
      type: object
      required: [id, code, name, status, score, controlsTotal, controlsMet, lastAuditAt]
      properties:
        id: { type: string }
        code: { type: string }
        name: { type: string }
        category: { type: string }
        status: { type: string, description: "passing | warning | gap" }
        score: { type: integer }
        controlsTotal: { type: integer }
        controlsMet: { type: integer }
        lastAuditAt: { type: string, format: date-time }

    ComplianceControl:
      type: object
      required: [id, frameworkId, code, title, status, evidenceCount]
      properties:
        id: { type: string }
        frameworkId: { type: string }
        code: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, description: "met | partial | gap" }
        owner: { type: string }
        evidenceCount: { type: integer }
        linkedRequirementCount: { type: integer }

    ComplianceFrameworkDetail:
      allOf:
        - $ref: "#/components/schemas/ComplianceFramework"
        - type: object
          properties:
            controls:
              type: array
              items: { $ref: "#/components/schemas/ComplianceControl" }

    DashboardSummary:
      type: object
      required:
        - totalRequirements
        - implementedRequirements
        - openGaps
        - complianceAdherence
        - traceabilityCoverage
        - velocityIndex
        - byStatus
        - byType
        - savings
      properties:
        totalRequirements: { type: integer }
        implementedRequirements: { type: integer }
        openGaps: { type: integer }
        complianceAdherence: { type: integer, description: "0-100" }
        traceabilityCoverage: { type: integer, description: "0-100" }
        velocityIndex: { type: integer, description: "0-100" }
        savings:
          type: object
          required: [estimatedAnnualUsd, hoursSaved]
          properties:
            estimatedAnnualUsd: { type: integer }
            hoursSaved: { type: integer }
        byStatus:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status: { type: string }
              count: { type: integer }
        byType:
          type: array
          items:
            type: object
            required: [type, count]
            properties:
              type: { type: string }
              count: { type: integer }

    ActivityEvent:
      type: object
      required: [id, kind, message, actor, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, description: "requirement | code | compliance | gap" }
        message: { type: string }
        actor: { type: string }
        entityCode: { type: string }
        createdAt: { type: string, format: date-time }

    PdlcStage:
      type: object
      required: [id, projectId, stage, completion, requirementCount]
      properties:
        id: { type: string }
        projectId: { type: string }
        stage: { type: string, description: "ideation | design | development | testing | launch | governance" }
        title: { type: string }
        completion: { type: integer, description: "0-100" }
        requirementCount: { type: integer }
        blockers: { type: integer }

    PatchPdlcStageBody:
      type: object
      properties:
        blockers: { type: integer, minimum: 0, description: "Number of active blockers for this stage" }
        completion: { type: integer, minimum: 0, maximum: 100, description: "Manual completion override 0-100" }

    LegacySystem:
      type: object
      required: [id, name, language, locScanned, requirementsExtracted, riskScore]
      properties:
        id: { type: string }
        name: { type: string }
        language: { type: string }
        description: { type: string }
        locScanned: { type: integer }
        requirementsExtracted: { type: integer }
        riskScore: { type: integer, description: "0-100, lower is better" }
        modernizationStatus: { type: string }

    DemoRequest:
      type: object
      required: [id, name, email, createdAt]
      properties:
        id: { type: string }
        name: { type: string }
        email: { type: string }
        company: { type: string }
        message: { type: string }
        createdAt: { type: string, format: date-time }

    CreateDemoRequestBody:
      type: object
      required: [name, email]
      properties:
        name: { type: string, minLength: 1 }
        email: { type: string, format: email }
        company: { type: string }
        message: { type: string }

    CaptureLeadBody:
      type: object
      required: [source]
      properties:
        source:
          type: string
          enum: [signup, login, waitlist]
          description: Which user moment triggered the capture

    CaptureLeadResult:
      type: object
      required: [captured, deduped]
      properties:
        captured: { type: boolean, description: True when a new row was inserted }
        deduped: { type: boolean, description: True when a matching (email,source) row already existed }
        id: { type: string, description: New row id when captured is true }

    BillingPlan:
      type: string
      enum: [standard, professional]
      description: Razorpay-billed plan tier (free and enterprise are not sold via Razorpay)

    BillingCadence:
      type: string
      enum: [monthly, annual]

    BillingSubscribeBody:
      type: object
      required: [plan, cadence]
      properties:
        plan: { $ref: "#/components/schemas/BillingPlan" }
        cadence: { $ref: "#/components/schemas/BillingCadence" }

    BillingSubscribeResult:
      type: object
      required: [kind, keyId, amountPaise, currency, plan, cadence]
      properties:
        kind:
          type: string
          enum: [subscription, order]
          description: subscription = monthly auto-renew. order = one-time annual.
        subscriptionId: { type: string }
        orderId: { type: string }
        keyId: { type: string, description: Razorpay public key id for Checkout }
        amountPaise: { type: integer, description: Amount in Indian paise (INR × 100) }
        currency: { type: string }
        plan: { $ref: "#/components/schemas/BillingPlan" }
        cadence: { $ref: "#/components/schemas/BillingCadence" }

    BillingVerifyBody:
      oneOf:
        - type: object
          required: [kind, razorpay_payment_id, razorpay_subscription_id, razorpay_signature]
          properties:
            kind: { type: string, enum: [subscription] }
            razorpay_payment_id: { type: string }
            razorpay_subscription_id: { type: string }
            razorpay_signature: { type: string }
        - type: object
          required: [kind, razorpay_payment_id, razorpay_order_id, razorpay_signature]
          properties:
            kind: { type: string, enum: [order] }
            razorpay_payment_id: { type: string }
            razorpay_order_id: { type: string }
            razorpay_signature: { type: string }

    BillingVerifyResult:
      type: object
      required: [ok, plan, cadence]
      properties:
        ok: { type: boolean }
        plan: { $ref: "#/components/schemas/BillingPlan" }
        cadence: { $ref: "#/components/schemas/BillingCadence" }

    BillingCancelResult:
      type: object
      required: [ok, cancelAtPeriodEnd]
      properties:
        ok: { type: boolean }
        cancelAtPeriodEnd: { type: boolean }

    BillingSubscriptionState:
      type: object
      required: [id, plan, cadence, status, cancelAtPeriodEnd]
      properties:
        id: { type: string }
        plan: { $ref: "#/components/schemas/BillingPlan" }
        cadence: { $ref: "#/components/schemas/BillingCadence" }
        status: { type: string }
        currentPeriodEnd: { type: string, format: date-time, nullable: true }
        cancelAtPeriodEnd: { type: boolean }
        razorpaySubscriptionId: { type: string, nullable: true }
        razorpayOrderId: { type: string, nullable: true }

    BillingMe:
      type: object
      required: [workspaceId, plan]
      properties:
        workspaceId: { type: string }
        plan: { type: string, description: One of free|standard|professional|enterprise }
        planActivatedAt: { type: string, format: date-time, nullable: true }
        planExpiresAt: { type: string, format: date-time, nullable: true }
        subscription:
          oneOf:
            - { $ref: "#/components/schemas/BillingSubscriptionState" }
            - { type: "null" }
